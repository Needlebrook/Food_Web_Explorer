<!DOCTYPE html>
<html>
<head>
  <title>Food Web Explorer</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- vis-network -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    body {
      background: linear-gradient(to bottom right, #eef5ef, #f8fbf8);
      font-family: "Segoe UI", sans-serif;
    }

    h2 {
      font-weight: 600;
      color: #2f4f3f;
    }

    #network {
      height: 80vh;
      border-radius: 18px;
      background: white;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      padding: 10px;
    }

    .btn-eco {
      background-color: #3c7d4f;
      border: none;
    }

    .btn-eco:hover {
      background-color: #2e6140;
    }

    .btn-eco-outline {
      border: 2px solid #3c7d4f;
      color: #3c7d4f;
    }

    .btn-eco-outline:hover {
      background-color: #3c7d4f;
      color: white;
    }

    #speciesDetails {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      z-index: 1000;
      max-width: 400px;
      display: none;
    }

    #speciesDetails img {
      max-width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }

    #loginModal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    #adminForm {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
      width: 90%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      cursor: pointer;
      font-size: 24px;
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 5px;
    }

    .form-section {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
    }

    .relationship-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .relationship-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
      width: 100%;
    }

    .relationship-row > div {
      flex: 1; 
    }

    .relationship-row select {
      width: 100%; 
      min-width: 150px; 
    }

    .relationship-row > div:last-child {
      flex: 0.5;  
    }

    .relationship-row button {
      white-space: nowrap;
    }

    /* Info Modal Styles */
    #infoModal {
      font-family: 'Segoe UI', Georgia, 'Times New Roman', serif;
    }

    #infoModalContent {
      color: #2c3e50;
    }

    #infoModalContent h4 {
      color: #2f4f3f;
      margin-top: 15px;
      margin-bottom: 10px;
      font-weight: 600;
      border-left: 4px solid #4CAF50;
      padding-left: 10px;
    }

    #infoModalContent p {
      margin-bottom: 12px;
      text-align: justify;
    }

    #infoModalContent ul, #infoModalContent ol {
      margin-bottom: 15px;
      padding-left: 25px;
    }

    #infoModalContent li {
      margin-bottom: 5px;
    }

    #infoModalContent .term {
      font-weight: bold;
      color: #2f4f3f;
      font-style: italic;
    }

    #infoModalContent .example {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      border-left: 3px solid #3c7d4f;
      margin: 15px 0;
      font-style: italic;
    }

    .info-close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .info-close:hover {
      color: #2f4f3f;
    }
  </style>
</head>
<body>

<div class="container mt-4 position-relative">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-2">
    <h2 class="text-center mb-0">🌿 Food Web Explorer</h2>
        <button type="button" id="ecoInfoBtn" class="btn btn-primary">🌍 About Ecosystems</button>
        <button type="button" id="webInfoBtn" class="btn btn-dark">🕸️ How to Read Food Webs</button>
    </div>
    <button id="loginBtn" class="btn btn-outline-success">🔑 Log in as Admin</button>
  </div>

  <!-- Ecosystem Buttons -->
  <div id="ecosystemButtons" class="d-flex flex-wrap gap-3 justify-content-center mb-4"></div>

  <!-- Back Button -->
  <div class="text-center mb-3">
    <button id="backBtn" class="btn btn-outline-success d-none">
      ← Back to Ecosystem
    </button>
  </div>

  <!-- Graph -->
  <div id="network"></div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<!-- Species Details -->
<div id="speciesDetails">
  <div class="modal-header">
    <h3>Species Details</h3>
    <span class="close-btn" onclick="closeSpeciesDetails()">&times;</span>
  </div>
  <div id="speciesContent"></div>
</div>

<!-- Login-->
<div id="loginModal">
  <div class="modal-header">
    <h3>Admin Login</h3>
    <span class="close-btn" onclick="closeLoginModal()">&times;</span>
  </div>
  <form id="loginForm">
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div id="loginError" class="error-message"></div>
    <button type="submit" class="btn btn-success">Login</button>
  </form>
</div>

<!-- Admin Form Modal -->
<div id="adminForm">
  <div class="modal-header">
    <h3>Create New Food Web</h3>
    <span class="close-btn" onclick="closeAdminForm()">&times;</span>
  </div>
    <div id="deleteSection" class="form-section mb-3" style="border-color: #dc3545; display: none;">
    <h4 class="text-danger">🗑️ Delete Food Web</h4>
    <div class="row">
      <div class="col-md-5">
        <label class="form-label">Select Ecosystem</label>
        <select class="form-control" id="deleteEcosystem">
          <option value="">-- Choose ecosystem --</option>
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label">Select Food Web</label>
        <select class="form-control" id="deleteWeb" disabled>
          <option value="">-- First select ecosystem --</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="button" class="btn btn-danger" id="deleteWebBtn" disabled onclick="confirmDeleteWeb()">Delete Web</button>
      </div>
    </div>
    <div id="deleteMessage" class="mt-2"></div>
  </div>
  <form id="webForm">
    <div class="form-section">
      <h4>Ecosystem</h4>
      
      <!-- Option to select existing ecosystem -->
      <div class="mb-3">
        <label class="form-label">Select Existing Ecosystem</label>
        <select class="form-control" id="ecosystem">
          <option value="">-- Choose existing --</option>
        </select>
      </div>
      
      <div class="text-center mb-2">- OR -</div>
      
      <!-- Option to create new ecosystem -->
      <div class="mb-3">
        <label class="form-label">Create New Ecosystem</label>
        <input type="text" class="form-control mb-2" id="newEcosystemName" placeholder="Ecosystem Name">
        <textarea class="form-control" id="newEcosystemDescription" placeholder="Description (optional)" rows="2"></textarea>
        <button type="button" class="btn btn-secondary mt-2" onclick="createNewEcosystem()">Create Ecosystem</button>
      </div>
      
      <div class="mb-3">
        <label for="webName" class="form-label">Food Web Name</label>
        <input type="text" class="form-control" id="webName" required>
      </div>
    </div>

    <div class="form-section">
      <h4>Organisms</h4>
      <div id="organismsList">
        <div class="organism-row mb-3">
          <input type="text" class="form-control mb-2" placeholder="Common Name" name="common_name[]" required>
          <input type="text" class="form-control mb-2" placeholder="Scientific Name" name="scientific_name[]" required>
          <select class="form-control mb-2" name="trophic_level[]" required>
            <option value="">Select Trophic Level</option>
            <option value="Producer">Producer</option>
            <option value="Primary Consumer">Primary Consumer</option>
            <option value="Secondary Consumer">Secondary Consumer</option>
            <option value="Apex Predator">Apex Predator</option>
          </select>
          <input type="file" class="form-control mb-2" name="image[]" accept="image/*">
          <button type="button" class="btn btn-danger btn-sm" onclick="removeOrganism(this)">Remove</button>
        </div>
      </div>
      <button type="button" class="btn btn-secondary" onclick="addOrganism()">+ Add Organism</button>
    </div>

    <div class="form-section">
      <h4>Feeding Relationships</h4>
      <div id="relationshipsList">
        <div class="relationship-row">
          <div class="d-flex align-items-center gap-2">
            <div>
              <small class="text-muted">Prey (gets eaten)</small>
              <select class="form-control prey-select" name="prey[]" required>
                <option value="">Select prey...</option>
              </select>
            </div>
            <span class="fw-bold">→</span>
            <div>
              <small class="text-muted">Predator (eats)</small>
              <select class="form-control predator-select" name="predator[]" required>
                <option value="">Select predator...</option>
              </select>
            </div>
            <div>
              <small class="text-muted">Type</small>
              <select class="form-control" name="feed_type[]" required>
                <option value="">Type</option>
                <option value="herbivore">Herbivore</option>
                <option value="carnivore">Carnivore</option>
              </select>
            </div>
            <button type="button" class="btn btn-danger btn-sm" onclick="removeRelationship(this)">Remove</button>
          </div>
</div>
      </div>
      <button type="button" class="btn btn-secondary" onclick="addRelationship()">+ Add Relationship</button>
    </div>

    <div id="formErrors" class="error-message"></div>
    <button type="submit" class="btn btn-success">Create Food Web</button>
  </form>
</div>

<!-- Info Modal -->
<div id="infoModal" class="modal" style="display: none; position: fixed; z-index: 1001; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
  <div style="background-color: #fefefe; margin: 10% auto; padding: 20px; border: 2px solid #2f4f3f; width: 80%; max-width: 600px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
      <h3 id="infoModalTitle" style="color: #2f4f3f; margin: 0;">Ecosystem Information</h3>
      <span onclick="closeInfoModal()" style="cursor: pointer; font-size: 28px; font-weight: bold; color: #aaa;">&times;</span>
    </div>
    <div id="infoModalContent" style="line-height: 1.6; max-height: 60vh; overflow-y: auto; padding-right: 10px;">
      <!-- Content will be inserted here -->
    </div>
  </div>
</div>

<script>
const container = document.getElementById("network");
const buttonContainer = document.getElementById("ecosystemButtons");
const backBtn = document.getElementById("backBtn");
const overlay = document.getElementById("overlay");
const speciesDetails = document.getElementById("speciesDetails");
const loginModal = document.getElementById("loginModal");
const adminForm = document.getElementById("adminForm");

let network;
let currentEcosystemId = null;
let currentView = 'ecosystem'; 
let currentWebId = null;
let isAdmin = false;

// ------------------
// COLORS
// ------------------
function getColor(level) {
  switch(level) {
    case "Producer": return "#4CAF50";
    case "Primary Consumer": return "#2196F3";
    case "Secondary Consumer": return "#FF9800";
    case "Apex Predator": return "#C62828";
    default: return "#9E9E9E";
  }
}

function getLevelNumber(level) {
  switch ((level || "").trim().toLowerCase()) {
    case "producer":
      return 1;
    case "primary consumer":
      return 2;
    case "secondary consumer":
      return 3;
    case "apex predator":
      return 4;
    default:
      return 5; 
  }
}

// ------------------
// MODAL FUNCTIONS
// ------------------
function showOverlay() {
  overlay.style.display = "block";
}

function hideOverlay() {
  overlay.style.display = "none";
}

function showSpeciesDetails(organismId) {
  fetchSpeciesDetails(organismId);
  showOverlay();
  speciesDetails.style.display = "block";
}

function closeSpeciesDetails() {
  hideOverlay();
  speciesDetails.style.display = "none";
}

function showLoginModal() {
  showOverlay();
  loginModal.style.display = "block";
}

function closeLoginModal() {
  hideOverlay();
  loginModal.style.display = "none";
  document.getElementById("loginForm").reset();
  document.getElementById("loginError").innerHTML = "";
}

function showAdminForm() {
  loadEcosystemsForForm();
  loadEcosystemsForDelete(); // Load ecosystems for delete dropdown
  showOverlay();
  adminForm.style.display = "block";
  
  // Show delete section if admin is logged in
  if (isAdmin) {
    document.getElementById("deleteSection").style.display = "block";
  } else {
    document.getElementById("deleteSection").style.display = "none";
  }
}

// ------------------
// DELETE WEB FUNCTIONS
// ------------------
async function loadEcosystemsForDelete() {
  const response = await fetch("/ecosystems");
  const ecosystems = await response.json();
  
  const select = document.getElementById("deleteEcosystem");
  select.innerHTML = '<option value="">-- Choose ecosystem --</option>';
  ecosystems.forEach(e => {
    select.innerHTML += `<option value="${e.id}">${e.name}</option>`;
  });
  
  // Reset web dropdown
  document.getElementById("deleteWeb").innerHTML = '<option value="">-- First select ecosystem --</option>';
  document.getElementById("deleteWeb").disabled = true;
  document.getElementById("deleteWebBtn").disabled = true;
}

// Load webs when ecosystem is selected
document.getElementById("deleteEcosystem").addEventListener("change", async function(e) {
  const ecosystemId = e.target.value;
  const webSelect = document.getElementById("deleteWeb");
  const deleteBtn = document.getElementById("deleteWebBtn");
  
  if (!ecosystemId) {
    webSelect.innerHTML = '<option value="">-- First select ecosystem --</option>';
    webSelect.disabled = true;
    deleteBtn.disabled = true;
    return;
  }
  
  try {
    const response = await fetch(`/ecosystems/${ecosystemId}/webs`);
    const data = await response.json();
    
    webSelect.innerHTML = '<option value="">-- Select web to delete --</option>';
    data.webs.forEach(web => {
      webSelect.innerHTML += `<option value="${web.id}">${web.name}</option>`;
    });
    webSelect.disabled = false;
    deleteBtn.disabled = true; // Still disabled until web selected
  } catch (error) {
    console.error("Error loading webs:", error);
  }
});

// Enable delete button when web is selected
document.getElementById("deleteWeb").addEventListener("change", function(e) {
  const deleteBtn = document.getElementById("deleteWebBtn");
  deleteBtn.disabled = !e.target.value;
});

// Confirm and delete web
async function confirmDeleteWeb() {
  const ecosystemId = document.getElementById("deleteEcosystem").value;
  const webId = document.getElementById("deleteWeb").value;
  const webName = document.getElementById("deleteWeb").selectedOptions[0].text;
  
  if (!ecosystemId || !webId) {
    document.getElementById("deleteMessage").innerHTML = '<span class="text-danger">Please select an ecosystem and web</span>';
    return;
  }
  
  if (confirm(`Are you sure you want to delete "${webName}"? This action cannot be undone!`)) {
    await deleteWeb(webId);
  }
}

async function deleteWeb(webId) {
  const deleteMsg = document.getElementById("deleteMessage");
  
  try {
    const response = await fetch(`/admin/webs/${webId}`, {
      method: "DELETE"
    });
    
    if (response.ok) {
      deleteMsg.innerHTML = '<span class="text-success">✅ Food web successfully deleted!</span>';
      
      // Refresh the web dropdown
      const ecosystemId = document.getElementById("deleteEcosystem").value;
      const webResponse = await fetch(`/ecosystems/${ecosystemId}/webs`);
      const data = await webResponse.json();
      
      const webSelect = document.getElementById("deleteWeb");
      webSelect.innerHTML = '<option value="">-- Select web to delete --</option>';
      data.webs.forEach(web => {
        webSelect.innerHTML += `<option value="${web.id}">${web.name}</option>`;
      });
      
      // Also refresh the main page buttons
      loadEcosystemButtons();
      
      // Clear success message after 3 seconds
      setTimeout(() => {
        deleteMsg.innerHTML = '';
      }, 3000);
    } else {
      const error = await response.json();
      deleteMsg.innerHTML = `<span class="text-danger">❌ Error: ${error.detail || "Unknown error"}</span>`;
    }
  } catch (error) {
    console.error("Error:", error);
    deleteMsg.innerHTML = '<span class="text-danger">❌ Network error</span>';
  }
}

function closeAdminForm() {
  hideOverlay();
  adminForm.style.display = "none";
  document.getElementById("webForm").reset();
  document.getElementById("formErrors").innerHTML = "";
}

// ------------------
// FETCH SPECIES DETAILS
// ------------------

async function fetchSpeciesDetails(organismId) {
  try {
    // Fix 1: Use the correct endpoint - /organisms/${organismId}
    const response = await fetch(`/organisms/${organismId}`);
    const data = await response.json();
    
    let content = `
      <div class="text-center">
        <h4>${data.common_name}</h4>
        <p><em>${data.scientific_name}</em></p>
        <p><strong>Trophic Level:</strong> ${data.trophic_level}</p>
    `;
    
    if (data.image_url) {
      // Fix 2: Use the image_url directly (it already starts with /static/)
      content += `<img src="${data.image_url}" alt="${data.common_name}" class="img-fluid mb-3">`;
    }
    
    if (data.prey && data.prey.length > 0) {
      content += `<p><strong>Preys on:</strong> ${data.prey.join(', ')}</p>`;
    }
    
    if (data.predators && data.predators.length > 0) {
      content += `<p><strong>Predators:</strong> ${data.predators.join(', ')}</p>`;
    }
    
    content += `</div>`;
    
    document.getElementById("speciesContent").innerHTML = content;
  } catch (error) {
    console.error("Error fetching species details:", error);
    document.getElementById("speciesContent").innerHTML = "<p class='text-danger'>Error loading species details</p>";
  }
}

// ------------------
// LOAD ECOSYSTEM BUTTONS
// ------------------
async function loadEcosystemButtons() {
  const response = await fetch("/ecosystems");
  const ecosystems = await response.json();

  buttonContainer.innerHTML = "";

  ecosystems.forEach(e => {
    const btn = document.createElement("button");
    btn.className = "btn btn-success px-4";
    btn.innerText = e.name;
    btn.onclick = () => loadEcosystem(e.id);
    buttonContainer.appendChild(btn);
  });
}

// ------------------
// LOAD ECOSYSTEM (Overview)
// ------------------
async function loadEcosystem(ecosystemId) {
  if (network) {
    network.destroy();
  }

  currentEcosystemId = ecosystemId;
  currentView = 'ecosystem';
  backBtn.classList.add("d-none");

  const response = await fetch(`/ecosystems/${ecosystemId}`);
  const data = await response.json();

  const nodes = new vis.DataSet(
    data.nodes.map(n => ({
      id: n.id,
      label: n.common_name,
      level: getLevelNumber(n.trophic_level),
      color: {
        background: getColor(n.trophic_level),
        border: "#2f4f3f"
      },
      shape: "dot",
      size: 26,
      font: { size: 16, color: "#1b1b1b" },
      shadow: true,
      organism_id: n.organism_id
    }))
  );

  const edges = new vis.DataSet(
    data.edges.map(e => ({
      from: e.from,
      to: e.to,
      arrows: { from: { enabled: true }},
      smooth: {
        type: "cubicBezier",
        forceDirection: "vertical"
      },
      web_id: e.web_id
    }))
  );

  network = new vis.Network(container, { nodes, edges }, {
  layout: {
    improvedLayout: true
  },
  physics: {
    enabled: true,
    solver: "forceAtlas2Based",
    forceAtlas2Based: {
      gravitationalConstant: -100,
      centralGravity: 0.005,
      springLength: 200,
      springConstant: 0.05
    },
    stabilization: {
      enabled: true,
      iterations: 1000,
      updateInterval: 25
    }
  },
  interaction: {
    hover: true
  }
});

// Add click handler for nodes
network.on("click", function(params) {
  console.log("Click detected", params); // Debug line
  if (params.nodes.length > 0) {
    // Clicked on a node - show species details
    const nodeId = params.nodes[0];
    const node = nodes.get(nodeId);
    console.log("Clicked node:", node); // Debug line
    if (node && node.organism_id) {
      showSpeciesDetails(node.organism_id);
    }
  } else if (params.edges.length > 0) {
    // Clicked on an edge - zoom into that web
    const edgeId = params.edges[0];
    const edge = edges.get(edgeId);
    console.log("Clicked edge:", edge); // Debug line
    if (edge && edge.web_id) {
      loadWeb(edge.web_id);
    }
  }
});

// Wait longer before turning off physics
network.once("stabilizationIterationsDone", function () {
  // Give it a little more time to settle
  setTimeout(() => {
    network.setOptions({ physics: false });
    network.fit();
  }, 500);
});

// ------------------
// LOAD WEB DETAIL VIEW
// ------------------
async function loadWeb(webId) {
  if (network) {
    network.destroy();
  }

  currentWebId = webId;
  currentView = 'web';

  const response = await fetch(`/food-webs/${webId}`);
  const data = await response.json();

  backBtn.classList.remove("d-none");
  
  // Get web name from the current web data
  // First, try to fetch web details to get the name
  let webName = "Food Web";
  try {
    const webResponse = await fetch(`/food-webs/${webId}/details`);
    if (webResponse.ok) {
      const webData = await webResponse.json();
      webName = webData.name;
    }
  } catch (error) {
    console.log("Could not fetch web name");
  }
  
  // Add web name display next to back button
  const backBtnContainer = backBtn.parentNode;
  
  // Check if web name display already exists
  let webNameDisplay = document.getElementById("webNameDisplay");
  if (!webNameDisplay) {
    webNameDisplay = document.createElement("span");
    webNameDisplay.id = "webNameDisplay";
    webNameDisplay.className = "ms-3 fw-bold text-success";
    backBtnContainer.appendChild(webNameDisplay);
  }
  webNameDisplay.textContent = `🌐 ${webName}`;
  webNameDisplay.style.display = "inline";

  const nodes = new vis.DataSet(
    data.nodes.map(n => ({
      id: n.id,
      label: n.common_name + "\n" + n.scientific_name,
      level: getLevelNumber(n.trophic_level),
      color: {
        background: getColor(n.trophic_level),
        border: "#2f4f3f"
      },
      shape: "box",
      margin: 10,
      font: { size: 15, color: "#1b1b1b" },
      shadow: true,
      organism_id: n.id
    }))
  );

  const edges = new vis.DataSet(
    data.edges.map(e => ({
      from: e.to,
      to: e.from,
      arrows: { to: { enabled: true }},
      smooth: {
        type: "cubicBezier",
        forceDirection: "vertical"
      }
    }))
  );

  network = new vis.Network(container, { nodes, edges }, {
    layout: {
      hierarchical: {
        direction: "DU",
        sortMethod: "directed",
        shakeTowards: "roots",
        levelSeparation: 150,
        nodeSpacing: 200
      }
    },
    physics: {
      enabled: true,
      hierarchicalRepulsion: {
        nodeDistance: 200
      },
      stabilization: {
        iterations: 200
      }
    },
    interaction: { hover: false }
  });

  network.on("click", function(params) {
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const node = nodes.get(nodeId);
      showSpeciesDetails(node.organism_id);
    }
  });

  network.once("stabilizationIterationsDone", function () {
    network.setOptions({ physics: false });
    network.fit();
  });

  network.fit();
}
}

// DATA VALIDATION FUNCTIONS
function validateOrganisms(organismRows) {
  const errors = [];
  const names = new Set();
  
  organismRows.forEach((row, index) => {
    const commonName = row.querySelector('input[name="common_name[]"]').value.trim();
    const scientificName = row.querySelector('input[name="scientific_name[]"]').value.trim();
    const trophicLevel = row.querySelector('select[name="trophic_level[]"]').value;
    
    // Check for empty fields
    if (!commonName) {
      errors.push(`Organism ${index + 1}: Common name is required`);
    }
    if (!scientificName) {
      errors.push(`Organism ${index + 1}: Scientific name is required`);
    }
    if (!trophicLevel) {
      errors.push(`Organism ${index + 1}: Trophic level is required`);
    }
    
    // Check for duplicate names within the same web
    const nameKey = `${commonName}|${scientificName}`.toLowerCase();
    if (names.has(nameKey)) {
      errors.push(`Duplicate organism: "${commonName}" (${scientificName}) appears twice`);
    }
    names.add(nameKey);
    
    // Validate trophic level
    const validLevels = ["Producer", "Primary Consumer", "Secondary Consumer", "Apex Predator"];
    if (!validLevels.includes(trophicLevel)) {
      errors.push(`Organism ${index + 1}: Invalid trophic level "${trophicLevel}"`);
    }
  });
  
  return errors;
}

function validateRelationships(relationshipRows, organismRows) {
  const errors = [];
  const relationships = new Set(); // Track unique relationships
  const organismCount = organismRows.length;
  
  relationshipRows.forEach((row, index) => {
    const predatorSelect = row.querySelector('select[name="predator[]"]');
    const preySelect = row.querySelector('select[name="prey[]"]');
    const feedType = row.querySelector('select[name="feed_type[]"]').value;
    
    const predatorVal = predatorSelect.value;
    const preyVal = preySelect.value;
    
    // Check if both are selected
    if (!predatorVal || !preyVal) {
      errors.push(`Relationship ${index + 1}: Please select both predator and prey`);
      return;
    }
    
    // Check if predator and prey are the same
    if (predatorVal === preyVal) {
      errors.push(`Relationship ${index + 1}: Organism cannot prey on itself`);
      return;
    }
    
    // Check for duplicate relationships
    const relKey = `${predatorVal}|${preyVal}`;
    if (relationships.has(relKey)) {
      errors.push(`Relationship ${index + 1}: Duplicate relationship (same predator-prey pair)`);
    }
    relationships.add(relKey);
    
    // Validate feed type
    if (!feedType || !['herbivore', 'carnivore'].includes(feedType)) {
      errors.push(`Relationship ${index + 1}: Invalid feed type (must be herbivore or carnivore)`);
    }
    
    // Get indices
    const predatorIdx = parseInt(predatorVal.replace('temp_', ''));
    const preyIdx = parseInt(preyVal.replace('temp_', ''));
    
    // Get trophic levels
    const predatorLevel = organismRows[predatorIdx].querySelector('select[name="trophic_level[]"]').value;
    const preyLevel = organismRows[preyIdx].querySelector('select[name="trophic_level[]"]').value;
    
    // Validate trophic level hierarchy
    const levelOrder = {
      "Producer": 1,
      "Primary Consumer": 2,
      "Secondary Consumer": 3,
      "Apex Predator": 4
    };
    
    if (levelOrder[predatorLevel] <= levelOrder[preyLevel]) {
      errors.push(`Relationship ${index + 1}: ${predatorLevel} cannot prey on ${preyLevel} (must be higher in food chain)`);
    }
    
    // Validate feed type matches trophic levels
    if (feedType === 'herbivore' && preyLevel !== 'Producer') {
      errors.push(`Relationship ${index + 1}: Herbivores should only prey on Producers`);
    }
    if (feedType === 'carnivore' && preyLevel === 'Producer') {
      errors.push(`Relationship ${index + 1}: Carnivores cannot prey on Producers`);
    }
  });
  
  return errors;
}

function validateImages(organismRows) {
  const errors = [];
  const maxSize = 5 * 1024 * 1024; // 5MB
  const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
  
  organismRows.forEach((row, index) => {
    const imageFile = row.querySelector('input[name="image[]"]').files[0];
    if (imageFile) {
      if (imageFile.size > maxSize) {
        errors.push(`Organism ${index + 1}: Image too large (max 5MB)`);
      }
      if (!allowedTypes.includes(imageFile.type)) {
        errors.push(`Organism ${index + 1}: Invalid image type (use JPG, PNG, GIF, or WebP)`);
      }
    }
  });
  
  return errors;
}

function checkForCircularRelationships(relationshipRows) {
  // Build adjacency list
  const graph = {};
  
  // First pass: build the graph
  for (let i = 0; i < relationshipRows.length; i++) {
    const row = relationshipRows[i];
    const predator = row.querySelector('select[name="predator[]"]').value;
    const prey = row.querySelector('select[name="prey[]"]').value;
    if (predator && prey) {
      if (!graph[predator]) graph[predator] = [];
      graph[predator].push(prey);
    }
  }
  
  // Second pass: check for cycles
  for (let i = 0; i < relationshipRows.length; i++) {
    const row = relationshipRows[i];
    const predator = row.querySelector('select[name="predator[]"]').value;
    const prey = row.querySelector('select[name="prey[]"]').value;
    
    if (predator && prey && graph[prey] && graph[prey].includes(predator)) {
      return ["Circular relationship detected (A eats B and B eats A)"];
    }
  }
  
  return [];
}

    currentSelections.push({
      prey: select.value,
      predator: predatorSelects[index].value
    });
  });
  
  // Build options
  let options = '<option value="">Select</option>';
  organisms.forEach((row, index) => {

    if (commonName) {
      options += `<option value="temp_${index}">${commonName}</option>`;
    }
  });
  
  // Update all selects
  preySelects.forEach((select, index) => {
    select.innerHTML = options;
    if (currentSelections[index] && currentSelections[index].prey) {
      select.value = currentSelections[index].prey;
    }
  });
  
  predatorSelects.forEach((select, index) => {
    select.innerHTML = options;
    if (currentSelections[index] && currentSelections[index].predator) {
      select.value = currentSelections[index].predator;
    }
  });
}

function showWebInfo() {

    <h4>Understanding Food Web Visualization</h4>
    <p>A <span class="term">food web</span> illustrates the feeding relationships within an ecosystem. Unlike a simple food chain (a linear sequence), a food web reveals the complex, interconnected reality of who eats whom in nature.</p>
    
    <h4>Trophic Levels</h4>
    <p>Organisms are organized by <span class="term">trophic level</span>, their position in the food chain:</p>
    <ul>
      <li><span style="color: #4CAF50; font-weight: bold;">Producers (Green)</span> - Autotrophs (plants, algae, phytoplankton) that create their own energy through photosynthesis or chemosynthesis. They form the foundation of every food web.</li>
      <li><span style="color: #2196F3; font-weight: bold;">Primary Consumers (Blue)</span> - Herbivores that eat producers directly. Examples: deer, grasshoppers, mussels, zooplankton.</li>
      <li><span style="color: #FF9800; font-weight: bold;">Secondary Consumers (Orange)</span> - Carnivores that eat primary consumers. Examples: small fish, spiders, crabs, starfish.</li>
      <li><span style="color: #C62828; font-weight: bold;">Apex Predators (Red)</span> - Top carnivores with no natural predators in their ecosystem. Examples: sharks, lions, eagles, sea otters.</li>
    </ul>
    
    <h4>Reading the Diagram</h4>
    <p>In this visualization, each <span class="term">node</span> (circle or box) represents a species. The color indicates its trophic level. <span class="term">Arrows</span> point <strong>from Prey to Predator</strong> - they show the direction of energy flow. Following an arrow tells you "who is eaten by whom."</p>
    
    <div class="example">
      <strong>Example:</strong> In a marine web, you might see: <br>
      <span style="color: #4CAF50;">Phytoplankton</span> <span style="font-weight: bold;">→</span> <span style="color: #2196F3;">Mussel</span> <span style="font-weight: bold;">→</span> <span style="color: #FF9800;">Crab</span> <span style="font-weight: bold;">→</span> <span style="color: #C62828;">Sea Otter</span><br>
      This shows the flow of energy from producer to apex predator.
    </div>
    
    <h4>Interpreting Complexity</h4>
    <p>A healthy food web shows multiple connections; most consumers eat several prey species and are eaten by several predators. This <span class="term">redundancy</span> creates stability; if one prey species declines, predators can switch to alternatives. Webs with few connections are fragile and vulnerable to collapse.</p>

      <li><span class="term">Keystone species</span> :- Some species have disproportionately large effects on their ecosystem; their removal can cause cascading extinctions.</li>

async function createNewEcosystem() {
  const name = document.getElementById("newEcosystemName").value;
  if (!name) {
    alert("Please enter an ecosystem name");
    return;
  }
  
  const description = document.getElementById("newEcosystemDescription").value;
  
  const formData = new FormData();
  formData.append("name", name);
  if (description) formData.append("description", description);
  
  try {
    const response = await fetch("/admin/ecosystems", {
      method: "POST",
      body: formData
    });
    
    const result = await response.json();
    
    if (response.ok) {
      alert(`Ecosystem "${name}" created successfully!`);
      document.getElementById("newEcosystemName").value = "";
      document.getElementById("newEcosystemDescription").value = "";
      
      // Refresh the ecosystem dropdown
      loadEcosystemsForForm();
      
      // Auto-select the new ecosystem
      setTimeout(() => {
        const select = document.getElementById("ecosystem");
        // Find and select the newly created ecosystem
        Array.from(select.options).forEach(option => {
          if (option.text === name) {
            option.selected = true;
          }
        });
      }, 500);
    } else {
      alert("Error creating ecosystem: " + (result.detail || "Unknown error"));
    }
  } catch (error) {
    console.error("Error:", error);
    alert("Network error creating ecosystem");
  }
}

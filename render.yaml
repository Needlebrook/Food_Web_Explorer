services:
  - type: web
    name: food-web-explorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: your-tidb-host
      - key: DB_PORT
        value: 4000
      - key: DB_USER
        value: 4WYKti6jL47pSBG.root
      - key: DB_PASSWORD
        sync: false  
      - key: DB_NAME
        value: food_web